<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Hunker</title>
    <style>
      :root {
        color-scheme: light dark;
        --muted: #59636e;
        --line: #d1d9e0;
        --accent: #0969da;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --muted: #9198a1;
          --line: #3d444d;
          --accent: #4493f8;
        }
      }
      body {
        width: 320px;
        margin: 0;
        padding: 14px 16px 16px;
        font:
          13px/1.45 system-ui,
          sans-serif;
      }
      h1 {
        margin: 0 0 4px;
        font-size: 15px;
      }
      #status {
        margin: 0 0 12px;
        color: var(--muted);
      }
      #status[data-server="Running"] {
        color: inherit;
      }
      fieldset {
        margin: 0 0 12px;
        padding: 0;
        border: 0;
      }
      legend {
        margin-bottom: 4px;
        font-weight: 600;
      }
      label {
        display: flex;
        gap: 6px;
        align-items: baseline;
        padding: 2px 0;
      }
      input[type="number"] {
        width: 80px;
      }
      button {
        width: 100%;
        margin: 4px 0 10px;
        padding: 6px 10px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--accent);
        color: white;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      button:disabled {
        background: transparent;
        color: var(--muted);
        cursor: default;
      }
      .note {
        margin: 0;
        color: var(--muted);
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <h1>Hunker</h1>
    <p id="status" role="status">Checking for Hunker…</p>
    <button id="open" type="button" disabled>Open this page in Hunker</button>
    <!-- Disabled until the background worker answers each request. -->
    <fieldset id="controls" disabled>
      <fieldset>
        <legend>Open GitHub links in Hunker</legend>
        <label><input type="radio" name="scope" value="Off" /> Off</label>
        <label>
          <input type="radio" name="scope" value="Reviews" />
          Pull requests, commits, and comparisons
        </label>
        <label>
          <input type="radio" name="scope" value="Everything" />
          Also files, commit history, and pull request lists
        </label>
      </fieldset>
      <label>
        Hunker port
        <input id="port" type="number" min="1" max="65535" />
      </label>
    </fieldset>
    <p class="note">
      Links from other apps and sites open in Hunker while it runs. Links within
      GitHub, and Hunker's own GitHub links, stay on GitHub.
    </p>
    <script type="module" src="popup.js"></script>
  </body>
</html>
